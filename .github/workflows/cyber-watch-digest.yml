name: Cyber Watch — Digest email

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright (scraping best-effort)
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Send digest
        working-directory: cyber-watch
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
        run: python digest.py

      - name: Commit updated state (dédoublonnage)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- cyber-watch/state.json; then
            echo "Pas de changement d'état à committer."
            exit 0
          fi

          # On repose toujours le state.json fraîchement calculé sur la dernière
          # version de main : évite tout conflit si main a avancé pendant le run
          # (merge, autre run), et réessaie en cas de push concurrent.
          cp cyber-watch/state.json /tmp/state.json
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/state.json cyber-watch/state.json
            git add cyber-watch/state.json
            if git diff --cached --quiet; then
              echo "État déjà à jour sur main, rien à pousser."
              exit 0
            fi
            git commit -m "Update cyber-watch digest state [skip ci]"
            if git push origin HEAD:main; then
              echo "État poussé (tentative $attempt)."
              exit 0
            fi
            echo "Push rejeté (tentative $attempt), nouvelle tentative..."
            sleep 2
          done
          echo "Échec du push de l'état après 5 tentatives."
          exit 1
